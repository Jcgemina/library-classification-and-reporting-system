<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img" aria-labelledby="title description">
  <title id="title">AppSys Library Physical Data Flow Diagram</title>
  <desc id="description">Physical data flow diagram showing the AppSys Library browser client, PHP application files, scheduled workers, MySQL database, upload and backup storage, Google Gemini API, and SMTP provider.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#475569"/></marker>
    <marker id="arrowStart" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto"><path d="M9 0 L0 4.5 L9 9 Z" fill="#475569"/></marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .zone { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .zone-title { font: 700 14px Arial, sans-serif; fill: #334155; letter-spacing: 1px; }
      .node { fill: #fff; stroke: #64748b; stroke-width: 1.5; }
      .process { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.7; }
      .store { fill: #ecfdf5; stroke: #059669; stroke-width: 1.7; }
      .service { fill: #faf5ff; stroke: #9333ea; stroke-width: 1.7; }
      .actor { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.7; }
      .node-title { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .node-body { font: 400 12px Arial, sans-serif; fill: #475569; }
      .flow { fill: none; stroke: #475569; stroke-width: 1.4; marker-end: url(#arrow); }
      .flow-bi { fill: none; stroke: #475569; stroke-width: 1.4; marker-start: url(#arrowStart); marker-end: url(#arrow); }
      .label { font: 400 11px Arial, sans-serif; fill: #334155; }
      .legend { font: 400 12px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <text x="70" y="50" class="title">AppSys Library — Physical Data Flow Diagram</text>
  <text x="70" y="75" class="subtitle">Actual implementation components and their data exchanges</text>

  <rect x="170" y="110" width="240" height="755" rx="12" class="zone"/>
  <text x="192" y="140" class="zone-title">CLIENT WORKSTATION</text>
  <rect x="455" y="110" width="590" height="755" rx="12" class="zone"/>
  <text x="477" y="140" class="zone-title">WEB / APPLICATION SERVER — APACHE + PHP</text>
  <rect x="1090" y="110" width="280" height="755" rx="12" class="zone"/>
  <text x="1112" y="140" class="zone-title">DATA AND FILE STORAGE</text>

  <rect x="35" y="230" width="105" height="64" rx="9" class="actor"/>
  <text x="87" y="256" text-anchor="middle" class="node-title">Librarian</text>
  <text x="87" y="274" text-anchor="middle" class="node-body">/ Staff</text>
  <rect x="35" y="650" width="105" height="64" rx="9" class="actor"/>
  <text x="87" y="677" text-anchor="middle" class="node-title">Administrator</text>
  <text x="87" y="695" text-anchor="middle" class="node-body">system control</text>

  <rect x="205" y="285" width="170" height="90" rx="9" class="node"/>
  <text x="290" y="318" text-anchor="middle" class="node-title">Web browser</text>
  <text x="290" y="339" text-anchor="middle" class="node-body">HTML · CSS · JavaScript</text>

  <rect x="485" y="180" width="230" height="78" rx="9" class="process"/>
  <text x="600" y="211" text-anchor="middle" class="node-title">Public authentication</text>
  <text x="600" y="231" text-anchor="middle" class="node-body">index.php · auth.php · forgot_password.php</text>
  <text x="600" y="247" text-anchor="middle" class="node-body">reset_password.php</text>

  <rect x="770" y="180" width="230" height="78" rx="9" class="process"/>
  <text x="885" y="211" text-anchor="middle" class="node-title">Application shell</text>
  <text x="885" y="231" text-anchor="middle" class="node-body">app.php</text>

  <rect x="485" y="330" width="230" height="78" rx="9" class="process"/>
  <text x="600" y="361" text-anchor="middle" class="node-title">Feature endpoints</text>
  <text x="600" y="381" text-anchor="middle" class="node-body">pages/*.php — HTML, JSON, CSV</text>

  <rect x="770" y="330" width="230" height="78" rx="9" class="process"/>
  <text x="885" y="361" text-anchor="middle" class="node-title">Shared services</text>
  <text x="885" y="381" text-anchor="middle" class="node-body">includes/functions.php · user_service.php</text>
  <text x="885" y="397" text-anchor="middle" class="node-body">ai_course_service.php</text>

  <rect x="485" y="480" width="230" height="78" rx="9" class="process"/>
  <text x="600" y="511" text-anchor="middle" class="node-title">AI course worker</text>
  <text x="600" y="531" text-anchor="middle" class="node-body">bin/ai_worker.php — scheduled CLI</text>

  <rect x="770" y="480" width="230" height="78" rx="9" class="process"/>
  <text x="885" y="511" text-anchor="middle" class="node-title">Email queue worker</text>
  <text x="885" y="531" text-anchor="middle" class="node-body">process_mail_queue.php — scheduled CLI</text>

  <rect x="485" y="630" width="230" height="78" rx="9" class="process"/>
  <text x="600" y="661" text-anchor="middle" class="node-title">PHP session handler</text>
  <text x="600" y="681" text-anchor="middle" class="node-body">config/session.php · host storage</text>

  <rect x="770" y="630" width="230" height="78" rx="9" class="process"/>
  <text x="885" y="661" text-anchor="middle" class="node-title">Backup and restore</text>
  <text x="885" y="681" text-anchor="middle" class="node-body">pages/backup.php + mysqldump / mysql</text>

  <rect x="1120" y="175" width="220" height="128" rx="9" class="store"/>
  <text x="1230" y="215" text-anchor="middle" class="node-title">MySQL: appsys_library</text>
  <text x="1230" y="238" text-anchor="middle" class="node-body">users · books · copies · courses</text>
  <text x="1230" y="255" text-anchor="middle" class="node-body">programs · prospectuses · policies</text>
  <text x="1230" y="272" text-anchor="middle" class="node-body">ai_jobs · email_queue · logs</text>
  <text x="1230" y="289" text-anchor="middle" class="node-body">embeddings · suggestion results</text>

  <rect x="1120" y="412" width="220" height="78" rx="9" class="store"/>
  <text x="1230" y="443" text-anchor="middle" class="node-title">Prospectus files</text>
  <text x="1230" y="463" text-anchor="middle" class="node-body">uploads/prospectuses/*.pdf</text>

  <rect x="1120" y="688" width="220" height="78" rx="9" class="store"/>
  <text x="1230" y="719" text-anchor="middle" class="node-title">Backup archive directory</text>
  <text x="1230" y="739" text-anchor="middle" class="node-body">BACKUP_DIR / backup_*.zip</text>

  <rect x="1410" y="465" width="155" height="75" rx="9" class="service"/>
  <text x="1487" y="495" text-anchor="middle" class="node-title">Google Gemini API</text>
  <text x="1487" y="516" text-anchor="middle" class="node-body">embeddings / relevance</text>
  <rect x="1410" y="610" width="155" height="75" rx="9" class="service"/>
  <text x="1487" y="640" text-anchor="middle" class="node-title">SMTP provider</text>
  <text x="1487" y="661" text-anchor="middle" class="node-body">setup / reset email</text>

  <path d="M140 262 H205" class="flow-bi"/><text x="147" y="252" class="label">library work</text>
  <path d="M140 682 H175 V330 H205" class="flow-bi"/><text x="145" y="326" class="label">admin operations</text>
  <path d="M375 313 H438 V219 H485" class="flow-bi"/><text x="387" y="211" class="label">sign-in / password-reset request and status</text>
  <path d="M375 330 H438 V369 H485" class="flow-bi"/><text x="382" y="360" class="label">AJAX requests / HTML, JSON, CSV response</text>
  <path d="M375 347 H430 V669 H770" class="flow"/><text x="432" y="659" class="label">backup / restore request</text>
  <path d="M715 219 H770" class="flow-bi"/><text x="717" y="209" class="label">authenticated request / page shell</text>
  <path d="M715 369 H770" class="flow-bi"/><text x="717" y="359" class="label">shared business logic</text>
  <path d="M600 258 V630" class="flow-bi"/><text x="610" y="444" class="label">start / validate session</text>
  <path d="M715 219 H1095 V239 H1120" class="flow-bi"/><text x="804" y="202" class="label">users, login attempts and reset tokens</text><text x="804" y="216" class="label">email_queue: add setup / reset email jobs</text>
  <path d="M715 369 H1120" class="flow-bi"/><text x="878" y="359" class="label">catalog, academic, reports, configuration</text>
  <path d="M715 386 H1050 V451 H1120" class="flow-bi"/><text x="887" y="441" class="label">write / retrieve prospectus PDFs</text>
  <path d="M715 519 H1120" class="flow-bi"/><text x="742" y="509" class="label">claim AI jobs; read book / course data; write job status and results</text>
  <path d="M715 519 H1410" class="flow-bi"/><text x="1030" y="509" class="label">book / course text; relevance results</text>
  <path d="M1000 500 H1075 V273 H1120" class="flow-bi"/><text x="826" y="453" class="label">email_queue: read ready jobs, claim jobs,</text><text x="826" y="467" class="label">update sent time, failure and retry status</text>
  <path d="M1000 519 H1058 V647 H1410" class="flow"/><text x="1062" y="638" class="label">send queued setup / reset email</text>
  <path d="M1000 669 H1080 V239 H1120" class="flow-bi"/><text x="1008" y="658" class="label">database export / restore</text>
  <path d="M1000 669 H1120" class="flow-bi"/><text x="1010" y="716" class="label">write / read ZIP archive</text>
  <path d="M1000 669 H1068 V451 H1120" class="flow-bi"/><text x="1005" y="578" class="label">include / restore uploads</text>

  <rect x="70" y="910" width="14" height="14" class="actor"/><text x="94" y="922" class="legend">User / client</text>
  <rect x="230" y="910" width="14" height="14" class="process"/><text x="254" y="922" class="legend">Deployed PHP component</text>
  <rect x="470" y="910" width="14" height="14" class="store"/><text x="494" y="922" class="legend">Physical data store</text>
  <rect x="680" y="910" width="14" height="14" class="service"/><text x="704" y="922" class="legend">External service</text>
  <path d="M890 917 H940" class="flow-bi"/><text x="952" y="922" class="legend">Bidirectional data flow</text>
  <text x="70" y="970" class="subtitle">The diagram intentionally names the deployed files, storage paths, workers, and integration endpoints used by this repository.</text>
</svg>
